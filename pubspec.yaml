name: AqsaPay
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+3

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions

dependencies:
  flutter:
    sdk: flutter

##  --------------------   Core packages  --------------------------

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.1
  flutter_svg: ^2.2.3
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  http: ^1.6.0
  flutter_screenutil_plus: ^1.4.0
  easy_localization: ^3.0.8
  smooth_page_indicator: ^2.0.1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  mobile_scanner: ^7.1.4
  flutter_secure_storage: ^10.0.0
  socket_io_client: ^3.1.4
  crypto: ^3.0.7
  uuid: ^4.5.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  percent_indicator: ^4.2.5
  android_package_installer: ^0.0.3
  package_info_plus: ^9.0.1
  open_file: ^3.5.11
  pdf: ^3.12.0
  printing: ^5.14.3
  device_info_plus: ^12.4.0

  ## ---- fire base packages ----
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  ## --------------------   Dev dependencies  --------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

    ## --------------------   Images Assets   --------------------------


  assets:
    - assets/images/
    - assets/svg/
    - assets/fonts/
    - assets/languages/
    
   ## --------------------   Fonts-Families Assets  --------------------------

  fonts:
    - family: DimaYekan
      fonts:
        - asset: assets/fonts/Dima-Yekan.ttf

    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Medium.ttf
        
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam-Medium.ttf


  
 